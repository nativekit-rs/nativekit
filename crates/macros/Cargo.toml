[package]
name = "native-kit-macros"
version = "0.1.0"
edition = "2021"
description = "Procedural macros and SwiftUI-style declarative UI syntax for the NativeKit engine"
homepage = "https://nativekit.rs"
repository = "https://github.com/nativekit-rs/nativekit"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
proc-macro2 = "1.0"
