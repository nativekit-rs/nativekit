[package]
name = "native-kit"
version = "0.1.1"
edition = "2021"
description = "High-performance 5-platform Dynamic UI Engine for Rust (iOS, Android, Linux, Windows, Web)"
homepage = "https://nativekit.rs"
repository = "https://github.com/nativekit-rs/nativekit"
license = "MIT"

[dependencies]
tiny_http = "0.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
native-kit-macros = { version = "0.1.1", path = "../macros" }
inventory = "0.3.24"
base64 = "0.23.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.43"
wasm-bindgen = "=0.2.93"

[features]
client = []
server = []

[build-dependencies]
serde_json = "1.0"
