<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NativeKit Web</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--rn-background, #ffffff);
            color: var(--rn-text, #000000);
            -webkit-font-smoothing: antialiased;
        }
        #root {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .hstack { display: flex; flex-direction: row; align-items: center; width: 100%; box-sizing: border-box; }
        .vstack { display: flex; flex-direction: column; width: 100%; box-sizing: border-box; }
        .large-title { font-size: 34px; line-height: 41px; }
        .title-1 { font-size: 28px; line-height: 34px; }
        .title-2 { font-size: 22px; line-height: 28px; }
        .title-3 { font-size: 20px; line-height: 25px; }
        .headline { font-size: 17px; line-height: 22px; }
        .body { font-size: 17px; line-height: 22px; }
        .callout { font-size: 16px; line-height: 21px; }
        .subhead { font-size: 15px; line-height: 20px; }
        .footnote { font-size: 13px; line-height: 18px; }
        .caption-1 { font-size: 12px; line-height: 16px; }
        .caption-2 { font-size: 11px; line-height: 13px; }
        .weight-thin { font-weight: 100; }
        .weight-ultralight { font-weight: 200; }
        .weight-light { font-weight: 300; }
        .weight-regular { font-weight: 400; }
        .weight-medium { font-weight: 500; }
        .weight-semibold { font-weight: 600; }
        .weight-bold { font-weight: 700; }
        .weight-heavy { font-weight: 800; }
        .weight-black { font-weight: 900; }
        .page-content {
            padding: 16px;
            box-sizing: border-box;
        }
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: opacity 0.15s, background-color 0.15s;
            width: fit-content;
            align-self: flex-start;
        }
        button.fill {
            width: 100%;
            align-self: stretch;
        }
        button:hover { opacity: 0.88; }
        button:active { opacity: 0.75; }
        button.primary {
            background-color: var(--rn-primary, #007AFF);
            color: #ffffff;
        }
        button.text {
            background-color: transparent;
            color: var(--rn-primary, #007AFF);
            padding: 6px 8px;
        }
        .nk-section-row.clickable:hover {
            background-color: var(--rn-surface-container, rgba(128,128,128,0.08));
        }
        button.secondary {
            background-color: var(--rn-surface, #E5E5EA);
            color: var(--rn-text, #000000);
        }
        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        @keyframes slide-out-left {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(-20%); opacity: 0.85; }
        }
        @keyframes slide-in-left {
            from { transform: translateX(-20%); opacity: 0.85; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slide-out-right {
            from { transform: translateX(0); }
            to { transform: translateX(100%); }
        }

        html[data-nav-direction="forward"]::view-transition-old(root) {
            animation: 0.28s cubic-bezier(0.32, 0.72, 0, 1) both slide-out-left;
        }
        html[data-nav-direction="forward"]::view-transition-new(root) {
            animation: 0.28s cubic-bezier(0.32, 0.72, 0, 1) both slide-in-right;
        }
        html[data-nav-direction="back"]::view-transition-old(root) {
            animation: 0.28s cubic-bezier(0.32, 0.72, 0, 1) both slide-out-right;
            z-index: 10;
        }
        html[data-nav-direction="back"]::view-transition-new(root) {
            animation: 0.28s cubic-bezier(0.32, 0.72, 0, 1) both slide-in-left;
        }
        html:not([data-nav-direction="forward"]):not([data-nav-direction="back"])::view-transition-old(root),
        html:not([data-nav-direction="forward"]):not([data-nav-direction="back"])::view-transition-new(root) {
            animation-duration: 0.15s;
        }

        /* Sheet Presentation */
        .sheet-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            
        }
        .sheet-container {
            background: var(--rn-background, #ffffff);
            color: var(--rn-text, #000000);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            
        }
        .sheet-handle {
            width: 36px;
            height: 5px;
            border-radius: 3px;
            background: rgba(120, 120, 128, 0.3);
            margin: 10px auto 4px auto;
        }
        @keyframes sheet-fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes sheet-slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        /* Form / Dialog Presentation */
        .dialog-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            
        }
        .dialog-container {
            background: var(--rn-surface, #ffffff);
            color: var(--rn-text, #000000);
            border: 1px solid var(--rn-border, rgba(128,128,128,0.2));
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            max-height: 82vh;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            
        }
        @keyframes dialog-pop-in {
            from { opacity: 0; transform: scale(0.96) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .page-slide-forward {
            animation: page-in-right 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .page-slide-back {
            animation: page-in-left 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes page-in-right {
            from { opacity: 0; transform: translateX(28px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes page-in-left {
            from { opacity: 0; transform: translateX(-28px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .sheet-backdrop.modal-enter {
            animation: sheet-fade-in 0.2s ease-out;
        }
        .sheet-container.modal-enter {
            animation: sheet-slide-up 0.26s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .dialog-backdrop.modal-enter {
            animation: sheet-fade-in 0.18s ease-out;
        }
        .dialog-container.modal-enter {
            animation: dialog-pop-in 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        const API_BASE = (window.location.origin && window.location.origin.startsWith("http")) ? "" : "http://127.0.0.1:5824";

        class DynamicUINode {
            constructor(name, props, children, inList = false) {
                this.name = name;
                this.props = props;
                this.children = children;
                this.inList = inList;
            }

            static decode(bytes, offsetObj, inList = false) {
                if (offsetObj.val >= bytes.length) return new DynamicUINode("error", {}, [], inList);
                
                function readU8() { let v = bytes[offsetObj.val]; offsetObj.val++; return v; }
                function readU16() { let v = bytes[offsetObj.val] | (bytes[offsetObj.val+1] << 8); offsetObj.val += 2; return v; }
                function readU32() { let v = bytes[offsetObj.val] | (bytes[offsetObj.val+1] << 8) | (bytes[offsetObj.val+2] << 16) | (bytes[offsetObj.val+3] << 24); offsetObj.val += 4; return v; }
                function readStr() {
                    let len = readU16();
                    let str = new TextDecoder("utf-8").decode(bytes.subarray(offsetObj.val, offsetObj.val + len));
                    offsetObj.val += len;
                    return str;
                }

                let type = readU8();
                if (type === 1) {
                    let name = readStr().toLowerCase();
                    let propsCount = readU16();
                    let props = {};
                    for (let i = 0; i < propsCount; i++) {
                        let k = readStr();
                        let vType = readU8();
                        if (vType === 0) props[k] = readStr();
                        else if (vType === 1) props[k] = (readU8() !== 0);
                        else if (vType === 2) props[k] = readU32();
                        else if (vType === 3) props[k] = readStr();
                        else if (vType === 4) props[k] = readStr();
                        else if (vType === 5) {
                            let len = readU32();
                            let str = new TextDecoder("utf-8").decode(bytes.subarray(offsetObj.val, offsetObj.val + len));
                            try { props[k] = JSON.parse(str); } catch(e) {}
                            offsetObj.val += len;
                        }
                    }
                    let childrenCount = readU16();
                    let children = [];
                    for(let i = 0; i < childrenCount; i++) {
                        children.push(DynamicUINode.decode(bytes, offsetObj, name === "list"));
                    }
                    return new DynamicUINode(name, props, children, inList);
                } else if (type === 2) {
                    let len = readU32();
                    let str = new TextDecoder("utf-8").decode(bytes.subarray(offsetObj.val, offsetObj.val + len));
                    offsetObj.val += len;
                    try {
                        let parsed = JSON.parse(str);
                        return new DynamicUINode("text", { label: typeof parsed === "string" ? parsed : JSON.stringify(parsed) }, [], inList);
                    } catch(e) {
                        return new DynamicUINode("text", { label: str }, [], inList);
                    }
                }
                return new DynamicUINode("error", {}, [], inList);
            }

            applyPatches(bytes, offsetObj, numPatches) {
                let currentRoot = this;
                for (let i = 0; i < numPatches; i++) {
                    let type = bytes[offsetObj.val]; offsetObj.val++;
                    let pathLen = bytes[offsetObj.val] | (bytes[offsetObj.val+1] << 8); offsetObj.val += 2;
                    let path = [];
                    for (let j = 0; j < pathLen; j++) {
                        path.push(bytes[offsetObj.val] | (bytes[offsetObj.val+1] << 8));
                        offsetObj.val += 2;
                    }
                    currentRoot = currentRoot.applyPatch(path, 0, type, bytes, offsetObj);
                }
                return currentRoot;
            }

            applyPatch(path, pathIdx, type, bytes, offsetObj) {
                function readU8() { let v = bytes[offsetObj.val]; offsetObj.val++; return v; }
                function readU16() { let v = bytes[offsetObj.val] | (bytes[offsetObj.val+1] << 8); offsetObj.val += 2; return v; }
                function readU32() { let v = bytes[offsetObj.val] | (bytes[offsetObj.val+1] << 8) | (bytes[offsetObj.val+2] << 16) | (bytes[offsetObj.val+3] << 24); offsetObj.val += 4; return v; }
                function readStr() {
                    let len = readU16();
                    let str = new TextDecoder("utf-8").decode(bytes.subarray(offsetObj.val, offsetObj.val + len));
                    offsetObj.val += len;
                    return str;
                }

                if (pathIdx === path.length) {
                    if (type === 0) return DynamicUINode.decode(bytes, offsetObj, this.inList);
                    else if (type === 1) {
                        let newProps = { ...this.props };
                        let propCount = readU16();
                        for (let i = 0; i < propCount; i++) {
                            let k = readStr();
                            let vType = readU8();
                            if (vType === 0) newProps[k] = readStr();
                            else if (vType === 1) newProps[k] = (readU8() !== 0);
                            else if (vType === 2) newProps[k] = readU32();
                            else if (vType === 3) newProps[k] = readStr();
                            else if (vType === 4) newProps[k] = readStr();
                            else if (vType === 5) {
                                let len = readU32();
                                let str = new TextDecoder("utf-8").decode(bytes.subarray(offsetObj.val, offsetObj.val + len));
                                try { newProps[k] = JSON.parse(str); } catch(e) {}
                                offsetObj.val += len;
                            }
                        }
                        return new DynamicUINode(this.name, newProps, this.children, this.inList);
                    } else if (type === 2) {
                        let newChildren = [...this.children];
                        newChildren.push(DynamicUINode.decode(bytes, offsetObj, this.name === "list"));
                        return new DynamicUINode(this.name, this.props, newChildren, this.inList);
                    } else if (type === 3) {
                        let len = readU16();
                        let newChildren = [...this.children];
                        if (len < newChildren.length) newChildren = newChildren.slice(0, len);
                        return new DynamicUINode(this.name, this.props, newChildren, this.inList);
                    }
                    return this;
                }
                
                let childIdx = path[pathIdx];
                let newChildren = [...this.children];
                if (childIdx < newChildren.length) {
                    newChildren[childIdx] = newChildren[childIdx].applyPatch(path, pathIdx + 1, type, bytes, offsetObj);
                }
                return new DynamicUINode(this.name, this.props, newChildren, this.inList);
            }
        }


        let liveUiNode = null;

        function applyB64UI(b64) {
            const binaryString = atob(b64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            
            let offsetObj = { val: 0 };
            if (bytes.length > 0) {
                let header = bytes[offsetObj.val]; offsetObj.val++;
                if (header === 0) {
                    liveUiNode = DynamicUINode.decode(bytes, offsetObj);
                } else if (header === 1) {
                    let patchCount = bytes[offsetObj.val] | (bytes[offsetObj.val+1] << 8); offsetObj.val += 2;
                    if (liveUiNode) {
                        liveUiNode = liveUiNode.applyPatches(bytes, offsetObj, patchCount);
                    }
                }
            }
            
            renderUI();
        }

        async function dispatch(action, payload) {
            if (window.wasm_api) {
                let payloadStr = payload !== undefined && payload !== null ? JSON.stringify(payload) : null;
                window.wasm_api.dispatch_event(action, payloadStr);
                fetchUI();
            } else {
                try {
                    const res = await fetch(`${API_BASE}/api/dispatch`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ action: action, payload: payload })
                    });
                    if (res.status === 200) {
                        const tsHdr = res.headers.get("X-Reload-Timestamp");
                        if (tsHdr) lastReloadTs = Number(tsHdr) || lastReloadTs;
                        const b64 = await res.text();
                        applyB64UI(b64);
                    } else {
                        fetchUI();
                    }
                } catch (e) {
                    console.error("dispatch error:", e);
                }
            }
        }

        
/* BEGIN_COLOR_HELPERS */
function isInlineWebColor(name) {
    return Boolean(name && (name.startsWith("#") || name.startsWith("rgb") || name.startsWith("hsl") || name.startsWith("var(")));
}

function resolveWebColor(name) {
    if (!name) return "";
    if (isInlineWebColor(name)) return name;
    return `var(--nk-color-${name})`;
}

function applyWebFgColor(el, color) {
    if (!color) return;
    if (isInlineWebColor(color)) {
        el.style.color = color;
    } else {
        el.classList.add(`nk-fg-${color}`);
    }
}

function applyWebBgColor(el, color) {
    if (!color) return;
    if (isInlineWebColor(color)) {
        el.style.backgroundColor = color;
    } else {
        el.classList.add(`nk-bg-${color}`);
    }
}

function applyWebContainerStyle(el, node) {
    if (!node || !node.props) return;
    if (node.props.spacing !== undefined) el.style.gap = node.props.spacing + "px";
    if (node.props.padding !== undefined) el.style.padding = node.props.padding + "px";
    if (node.props.corner_radius !== undefined) el.style.borderRadius = node.props.corner_radius + "px";
    if (node.props.opacity !== undefined) el.style.opacity = (node.props.opacity / 100.0).toString();
    if (node.props.background_image) {
        el.style.backgroundImage = `url("${node.props.background_image}")`;
        el.style.backgroundSize = "cover";
        el.style.backgroundPosition = "center";
        el.style.backgroundRepeat = "no-repeat";
    } else if (node.props.background_gradient) {
        const grad = node.props.background_gradient;
        const gType = grad.type || "linear";
        const angle = (grad.angle !== undefined) ? grad.angle : 90;
        const stops = (grad.stops || []).map(s => {
            const base = resolveWebColor(s.color);
            const pos = Math.round(((s.position !== undefined) ? s.position : 0) * 100);
            const op = (s.opacity !== undefined) ? s.opacity : 1.0;
            const colExpr = (op < 0.999) ? `color-mix(in srgb, ${base} ${Math.round(op * 100)}%, transparent)` : base;
            return `${colExpr} ${pos}%`;
        });
        if (stops.length >= 2) {
            if (gType === "radial") {
                el.style.backgroundImage = `radial-gradient(circle, ${stops.join(", ")})`;
            } else if (gType === "angular" || gType === "conic") {
                el.style.backgroundImage = `conic-gradient(${stops.join(", ")})`;
            } else {
                el.style.backgroundImage = `linear-gradient(${angle}deg, ${stops.join(", ")})`;
            }
        }
    } else if (node.props.background) {
        applyWebBgColor(el, node.props.background);
    }
}
/* END_COLOR_HELPERS */


        let prevWebState = { tabIdx: 0, winDepth: 1, winTitle: "", modalCount: 0, topModalDepth: 0 };

        function findNavStackNode(node) {
            if (!node) return null;
            if (node.name === "navigationstack") return node;
            if (node.children) {
                for (const c of node.children) {
                    const found = findNavStackNode(c);
                    if (found) return found;
                }
            }
            return null;
        }

        function extractNavLayers(navNode) {
            const windowPages = [];
            const modalLayers = [];
            if (!navNode || !navNode.children || navNode.children.length === 0) {
                return { windowPages, modalLayers };
            }
            const hasOverlay = Boolean(navNode.props && navNode.props.has_overlay);
            const windowCount = Math.min(
                navNode.children.length,
                (navNode.props && typeof navNode.props.window_count === "number")
                    ? navNode.props.window_count
                    : (hasOverlay ? Math.max(1, navNode.children.length - 1) : navNode.children.length)
            );
            for (let i = 0; i < windowCount; i++) windowPages.push(navNode.children[i]);

            const defaultPop = (navNode.props && navNode.props.on_pop) || "";
            const defaultDismiss = (navNode.props && navNode.props.on_dismiss) || defaultPop;

            let curNav = navNode;
            let curWinCount = windowCount;
            let curHasOverlay = hasOverlay;

            while (curHasOverlay && curNav.children && curNav.children.length > curWinCount) {
                const kind = (curNav.props && curNav.props.overlay_kind) || "sheet";
                const onPop = (curNav.props && curNav.props.on_pop) || defaultPop;
                const onDismiss = (curNav.props && curNav.props.on_dismiss) || defaultDismiss || onPop;
                const firstOverlay = curNav.children[curWinCount];

                if (firstOverlay.name === "navigationstack") {
                    const nextHasOverlay = Boolean(firstOverlay.props && firstOverlay.props.has_overlay);
                    const nextCount = firstOverlay.children ? firstOverlay.children.length : 0;
                    const nextWinCount = Math.min(
                        nextCount,
                        (firstOverlay.props && typeof firstOverlay.props.window_count === "number")
                            ? firstOverlay.props.window_count
                            : (nextHasOverlay ? Math.max(1, nextCount - 1) : nextCount)
                    );
                    const pages = [];
                    for (let i = 0; i < nextWinCount; i++) pages.push(firstOverlay.children[i]);
                    const layerPop = (firstOverlay.props && firstOverlay.props.on_pop) || onPop;
                    const layerDismiss = (firstOverlay.props && firstOverlay.props.on_dismiss) || onDismiss;
                    if (pages.length > 0) {
                        modalLayers.push({ pages, kind, onPop: layerPop, onDismiss: layerDismiss });
                    }
                    curNav = firstOverlay;
                    curWinCount = nextWinCount;
                    curHasOverlay = nextHasOverlay;
                } else {
                    const pages = curNav.children.slice(curWinCount);
                    if (pages.length > 0) {
                        modalLayers.push({ pages, kind, onPop, onDismiss });
                    }
                    break;
                }
            }
            return { windowPages, modalLayers };
        }

        function renderNavigationStack(node) {
            const el = document.createElement("div");
            el.classList.add("navigationstack");
            el.style.cssText = "width:100%;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;";

            const { windowPages, modalLayers } = extractNavLayers(node);
            const winDepth = windowPages.length;
            const activeWin = winDepth > 0 ? windowPages[winDepth - 1] : null;
            const winTitle = (activeWin && activeWin.props && activeWin.props.title) || "";

            if (activeWin) {
                const pageEl = renderNode(activeWin);
                if (winDepth !== prevWebState.winDepth && modalLayers.length === 0) {
                    pageEl.classList.add(winDepth > prevWebState.winDepth ? "page-slide-forward" : "page-slide-back");
                }
                el.appendChild(pageEl);
            }

            modalLayers.forEach((layer, idx) => {
                const isForm = ["form", "dialog", "modal", "fullscreen"].includes(layer.kind);
                const isNewlyOpenedLayer = (idx >= prevWebState.modalCount);
                const backdrop = document.createElement("div");
                backdrop.className = (isForm ? "dialog-backdrop" : "sheet-backdrop") + (isNewlyOpenedLayer ? " modal-enter" : "");
                backdrop.style.zIndex = String(1000 + idx * 100);
                backdrop.addEventListener("click", (e) => {
                    if (e.target === backdrop && layer.onDismiss) {
                        dispatch(layer.onDismiss, null);
                    }
                });

                const container = document.createElement("div");
                container.className = (isForm ? "dialog-container" : "sheet-container") + (isNewlyOpenedLayer ? " modal-enter" : "");
                if (!isForm) {
                    const handle = document.createElement("div");
                    handle.className = "sheet-handle";
                    container.appendChild(handle);
                }

                const topModalPage = layer.pages[layer.pages.length - 1];
                const modalEl = renderNode(topModalPage);
                const isTopLayer = (idx === modalLayers.length - 1);
                if (isTopLayer && modalLayers.length === prevWebState.modalCount && layer.pages.length !== prevWebState.topModalDepth) {
                    modalEl.classList.add(layer.pages.length > prevWebState.topModalDepth ? "page-slide-forward" : "page-slide-back");
                }
                container.appendChild(modalEl);
                backdrop.appendChild(container);
                el.appendChild(backdrop);
            });

            prevWebState.winDepth = winDepth;
            prevWebState.winTitle = winTitle;
            prevWebState.modalCount = modalLayers.length;
            prevWebState.topModalDepth = modalLayers.length > 0 ? modalLayers[modalLayers.length - 1].pages.length : 0;

            return el;
        }

        
        // React-style declarative DOM helper: h("div", { className: "vstack", style: {...}, onClick: fn }, children)
        function h(tag, props, children) {
            const el = document.createElement(tag);
            if (props) {
                if (props.className) el.className = props.className;
                if (props.style) Object.assign(el.style, props.style);
                if (props.attrs) {

                root.children.length > 0 &&
                windowPages.length === prevWebState.winDepth &&
                modalLayers.length === prevWebState.modalCount &&
                (modalLayers.length === 0 || modalLayers[modalLayers.length - 1].pages.length === prevWebState.topModalDepth) &&
                ((windowPages.length > 0 && windowPages[windowPages.length - 1].props && windowPages[windowPages.length - 1].props.title) || "") === prevWebState.winTitle
            );
            if (sameNavState) {
                morphNode(root.children[0], liveUiNode);
            } else {
                const activeScrolls = Array.from(root.querySelectorAll(".page-content")).map(el => el.scrollTop);
                root.innerHTML = "";
                root.appendChild(renderNode(liveUiNode));
                const newScrolls = Array.from(root.querySelectorAll(".page-content"));
                newScrolls.forEach((el, i) => {
                    if (activeScrolls[i]) el.scrollTop = activeScrolls[i];
                });
            }
        }

        async function fetchUI(requestedPath) {
            try {
                let b64 = "";
                if (window.wasm_api) {
                    b64 = window.wasm_api.get_ui();
                } else {
                    const p = (requestedPath !== undefined && requestedPath !== null) ? requestedPath : "";
                    const query = (p && p !== "/") ? `?path=${encodeURIComponent(p)}` : "";
                    const res = await fetch(`${API_BASE}/api/ui_layout${query}`);
                    if (res.status !== 200) throw new Error("Failed");
                    const tsHdr = res.headers.get("X-Reload-Timestamp");
                    if (tsHdr) lastReloadTs = Number(tsHdr) || lastReloadTs;
                    b64 = await res.text();
                }
                applyB64UI(b64);
            } catch (e) {
                console.error("fetchUI error:", e);
                if (!window.wasm_api) {
                    setTimeout(() => fetchUI(), 1000);
                }
            }
        }
        
        let lastReloadTs = 0;
        let isPolling = false;
        window.checkReload = async function checkReload() {
            if (isPolling) return;
            isPolling = true;
            while (!window.wasm_api) {
                try {
                    const res = await fetch(`${API_BASE}/api/live_reload?wait_for=${lastReloadTs}`);
                    const json = await res.json();
                    if (json.timestamp && json.timestamp !== lastReloadTs) {
                        lastReloadTs = json.timestamp;
                        const linkEl = document.querySelector("link[href^=\"theme.css\"]");
                        if (linkEl) linkEl.href = `theme.css?t=${lastReloadTs}`;
                        await fetchUI();
                    } else {
                        await new Promise(r => setTimeout(r, 150));
                    }
                } catch (e) {
                    await new Promise(r => setTimeout(r, 300));
                }
            }
        }
        
        window.js_trigger_refresh = () => fetchUI();
        globalThis.js_trigger_refresh = window.js_trigger_refresh;
    </script>
    <script type="module">
        async function initWasm() {
            try {
                if (window.location.port === "5824") return false;
                const module = await import('./wasm_app.js');
                await module.default();
                window.wasm_api = module;
                module.init_app();
                window.js_trigger_refresh();
                return true;
            } catch (e) {
                console.error("WASM initialization error:", e);
                return false;
            }
        }

        initWasm().then(isWasm => {
            if (!isWasm) {
                fetchUI(window.location.pathname);
                window.checkReload();
                window.checkReload();
            }
        });
    </script>
</body>
